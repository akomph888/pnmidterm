    // ฟังก์ชันสุ่มลำดับคำถามแบบ Fisher-Yates
    function shuffleArray(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // กุญแจจัดเก็บ Session Storage
    const SESSION_KEY = 'BCN_MIDTERM_EXAM_SESSION_V1';
    const ATTEMPTS_KEY = 'BCN_MIDTERM_EXAM_HISTORY_V1';
    const TEACHER_PIN_DEFAULT = '1234'; // รหัสผ่านสำหรับอาจารย์ผู้คุมสอบ

    function MidtermExamApp() {
      const MAX_ATTEMPTS = 1; // ข้อสอบกลางภาค อนุญาต 1 ครั้งมาตรฐาน (หรือปรับได้)
      const EXAM_DURATION_SECONDS = 3600; // 60 นาที (สำหรับ 60 ข้อ)
      const MAX_VIOLATIONS = 3; // สลับหน้าจอ/หลุดจอเกิน 3 ครั้ง ปรับตกส่งข้อสอบทันที

      // State สถานะผู้เข้าสอบ
      const [userName, setUserName] = useState('');
      const [studentId, setStudentId] = useState('');
      const [seatNumber, setSeatNumber] = useState('');
      const [loginError, setLoginError] = useState('');
      
      // State การสอบ
      const [isStarted, setIsStarted] = useState(false);
      const [shuffledQuestions, setShuffledQuestions] = useState([]);
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const [score, setScore] = useState(0);
      const [showResult, setShowResult] = useState(false);
      const [showReview, setShowReview] = useState(false);
      const [timeLeft, setTimeLeft] = useState(EXAM_DURATION_SECONDS);
      const [answers, setAnswers] = useState([]);
      const [attemptsRecord, setAttemptsRecord] = useState({});

      // State ระบบรักษาความปลอดภัย & ล็อกหน้าจอ
      const [isFullscreen, setIsFullscreen] = useState(false);
      const [violations, setViolations] = useState([]); // บันทึก timestamp และประเภทการหลุด
      const [showLockWarningModal, setShowLockWarningModal] = useState(false);
      const [lockWarningReason, setLockWarningReason] = useState('');
      const [isDisqualified, setIsDisqualified] = useState(false);
      const [confirmSubmitModal, setConfirmSubmitModal] = useState(false);

      // State สำหรับโหมดอาจารย์ผู้คุมสอบ (Instructor Dashboard)
      const [isTeacherMode, setIsTeacherMode] = useState(false);
      const [showTeacherAuthModal, setShowTeacherAuthModal] = useState(false);
      const [teacherPinInput, setTeacherPinInput] = useState('');
      const [teacherPinError, setTeacherPinError] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [filterStatus, setFilterStatus] = useState('ALL'); // ALL, PASSED, FAILED, DISQUALIFIED
      const [selectedAuditRecord, setSelectedAuditRecord] = useState(null);
      const [selectedStudentForView, setSelectedStudentForView] = useState(null);

      // โหลดประวัติผลสอบเดิมจาก LocalStorage
      useEffect(() => {
        try {
          const savedHistory = localStorage.getItem(ATTEMPTS_KEY);
          if (savedHistory) {
            setAttemptsRecord(JSON.parse(savedHistory));
          }
        } catch (err) {
          console.error("Failed to parse attempts history", err);
        }
      }, []);

      // ตรวจสอบและกู้คืน Session หากผู้สอบกำลังสอบอยู่แล้วหน้าเว็บรีเฟรช
      useEffect(() => {
        try {
          const activeSession = sessionStorage.getItem(SESSION_KEY);
          if (activeSession) {
            const data = JSON.parse(activeSession);
            if (data.isStarted && !data.showResult) {
              setUserName(data.userName || '');
              setStudentId(data.studentId || '');
              setSeatNumber(data.seatNumber || '');
              setShuffledQuestions(data.shuffledQuestions || []);
              setCurrentQuestion(data.currentQuestion || 0);
              setAnswers(data.answers || []);
              setTimeLeft(data.timeLeft > 0 ? data.timeLeft : 10);
              setViolations(data.violations || []);
              setIsStarted(true);

              // แจ้งเตือนว่ากำลังอยู่ในระบบสอบที่ถูกกู้คืน
              setLockWarningReason('ระบบตรวจพบว่าหน้าเว็บถูกรีเฟรช คุณต้องกลับเข้าสู่โหมดเต็มจอเพื่อทำข้อสอบต่อทันที');
              setShowLockWarningModal(true);
            }
          }
        } catch (err) {
          console.error("Failed to recover session", err);
        }
      }, []);

      // บันทึก Session ลงใน sessionStorage ทุกครั้งที่สถานะเปลี่ยน
      useEffect(() => {
        if (isStarted && !showResult) {
          const sessionPayload = {
            userName,
            studentId,
            seatNumber,
            shuffledQuestions,
            currentQuestion,
            answers,
            timeLeft,
            violations,
            isStarted: true,
            showResult: false
          };
          try {
            sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionPayload));
          } catch (e) {
            console.error("Failed to write to sessionStorage", e);
          }
        }
      }, [isStarted, showResult, userName, studentId, seatNumber, shuffledQuestions, currentQuestion, answers, timeLeft, violations]);

      // ฟังก์ชันเปิด Fullscreen
      const enterFullscreen = async () => {
        try {
          const elem = document.documentElement;
          if (elem.requestFullscreen) {
            await elem.requestFullscreen();
            setIsFullscreen(true);
          } else if (elem.webkitRequestFullscreen) {
            await elem.webkitRequestFullscreen();
            setIsFullscreen(true);
          } else if (elem.msRequestFullscreen) {
            await elem.msRequestFullscreen();
            setIsFullscreen(true);
          } else {
            // กรณีเป็น iPhone / iOS Safari ที่ไม่รองรับ Fullscreen API บน Document
            setIsFullscreen(true);
          }
          setShowLockWarningModal(false);
        } catch (err) {
          // หากเบราว์เซอร์มือถือปฏิเสธ ให้ยอมรับสถานะและปิด modal เพื่อไม่ให้ผู้สอบติดค้าง
          setIsFullscreen(true);
          setShowLockWarningModal(false);
        }
      };

      // ฟังก์ชันบันทึกการละเมิดกฎการสอบ
      const triggerSecurityViolation = useCallback((reason) => {
        if (!isStarted || showResult || isDisqualified) return;

        const timeString = new Date().toLocaleTimeString('th-TH');
        const newViolation = { reason, timestamp: timeString };

        setViolations((prev) => {
          const updated = [...prev, newViolation];
          if (updated.length >= MAX_VIOLATIONS) {
            // ละเมิดครบตามที่กำหนด -> ตัดสิทธิ์และส่งข้อสอบทันที
            setIsDisqualified(true);
            setTimeout(() => {
              forceFinishExam(true, updated);
            }, 600);
          } else {
            setLockWarningReason(`ตรวจพบการละเมิด: "${reason}" (ครั้งที่ ${updated.length}/${MAX_VIOLATIONS}) กรุณากดปุ่มด้านล่างเพื่อยืนยันและกลับเข้าสู่หน้าจอสอบ`);
            setShowLockWarningModal(true);
          }
          return updated;
        });
      }, [isStarted, showResult, isDisqualified]);

      // ตรวจจับการออกจาก Fullscreen
      useEffect(() => {
        const handleFullscreenChange = () => {
          const isCurrentlyFull = !!(
            document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.mozFullScreenElement ||
            document.msFullscreenElement
          );
          setIsFullscreen(isCurrentlyFull);
          // ทำงานเฉพาะอุปกรณ์ที่รองรับ Fullscreen API จริงๆ
          if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
            if (isStarted && !showResult && !isCurrentlyFull) {
              triggerSecurityViolation('ออกจากโหมดเต็มจอ (Exited Fullscreen)');
            }
          }
        };

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('mozfullscreenchange', handleFullscreenChange);
        document.addEventListener('MSFullscreenChange', handleFullscreenChange);

        return () => {
          document.removeEventListener('fullscreenchange', handleFullscreenChange);
          document.removeEventListener('webkitfullscreenchange', handleFullscreenChange);
          document.removeEventListener('mozfullscreenchange', handleFullscreenChange);
          document.removeEventListener('MSFullscreenChange', handleFullscreenChange);
        };
      }, [isStarted, showResult, triggerSecurityViolation]);

      // ตรวจจับการสลับแท็บ ยุบเบราว์เซอร์ หรือสลับแอปบนมือถือ (Visibility, Pagehide & Blur)
      useEffect(() => {
        if (!isStarted || showResult) return;

        const handleVisibilityChange = () => {
          if (document.hidden) {
            triggerSecurityViolation('สลับหน้าต่างหรือแท็บอื่น / สลับแอปบนมือถือ (Hidden Window / App Switch)');
          }
        };

        const handlePageHide = () => {
          triggerSecurityViolation('ยุบหน้าจอหรือสลับแอปพลิเคชัน (Pagehide / Minimized)');
        };

        const handleWindowBlur = () => {
          setTimeout(() => {
            if (document.hidden) {
              triggerSecurityViolation('คลิกออกนอกหน้าจอสอบ (Window Focus Lost)');
            }
          }, 350);
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);
        window.addEventListener('pagehide', handlePageHide);
        window.addEventListener('blur', handleWindowBlur);

        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          window.removeEventListener('pagehide', handlePageHide);
          window.removeEventListener('blur', handleWindowBlur);
        };
      }, [isStarted, showResult, triggerSecurityViolation]);

      // บล็อกคีย์ลัดอันตราย (F12, Ctrl+C, Ctrl+V, Ctrl+U, PrintScreen, Alt+Tab) และการคลิกขวา
      useEffect(() => {
        if (!isStarted || showResult) return;

        const handleContextMenu = (e) => {
          e.preventDefault();
          return false;
        };

        const handleKeyDown = (e) => {
          // F12 (DevTools)
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            triggerSecurityViolation('พยายามเปิด Developer Tools (F12)');
            return false;
          }

          // Ctrl+C, Ctrl+V, Ctrl+U, Ctrl+P, Ctrl+S, Ctrl+A
          if (e.ctrlKey || e.metaKey) {
            const forbiddenKeys = ['c', 'v', 'u', 's', 'p', 'a', 'x'];
            if (forbiddenKeys.includes(e.key.toLowerCase())) {
              e.preventDefault();
              triggerSecurityViolation(`พยายามใช้คีย์ลัดห้ามใช้ (Ctrl+${e.key.toUpperCase()})`);
              return false;
            }
          }

          // Alt + Tab หรือ Windows Key
          if (e.altKey && e.key === 'Tab') {
            e.preventDefault();
            triggerSecurityViolation('ตรวจพบคีย์ลัดสลับหน้าจอ (Alt+Tab)');
            return false;
          }
        };

        document.addEventListener('contextmenu', handleContextMenu);
        window.addEventListener('keydown', handleKeyDown);

        return () => {
          document.removeEventListener('contextmenu', handleContextMenu);
          window.removeEventListener('keydown', handleKeyDown);
        };
      }, [isStarted, showResult, triggerSecurityViolation]);

      useEffect(() => {
        let timer;
        if (isStarted && !showResult && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft((prev) => prev - 1);
          }, 1000);
        } else if (timeLeft === 0 && isStarted && !showResult) {
          forceFinishExam(false, violations);
        }
        return () => clearInterval(timer);
      }, [isStarted, showResult, timeLeft, violations]);

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };

      // เริ่มต้นทำข้อสอบ
      const handleStartExam = async (e) => {
        e.preventDefault();
        const trimmedId = studentId.trim();
        const trimmedName = userName.trim();

        if (!trimmedName || !trimmedId) {
          setLoginError('กรุณากรอกชื่อ-นามสกุล และรหัสประจำตัวนักศึกษาให้ครบถ้วน');
          return;
        }

        const userHistory = attemptsRecord[trimmedId] || [];
        if (userHistory.length >= MAX_ATTEMPTS) {
          setLoginError(`รหัสประจำตัว ${trimmedId} ได้เข้าทำข้อสอบกลางภาคแล้ว (จำกัด ${MAX_ATTEMPTS} ครั้ง)`);
          return;
        }

        setLoginError('');
        
        // สุ่มชุดคำถาม 60 ข้อ
        const randomized = shuffleArray(MIDTERM_QUESTIONS);
        setShuffledQuestions(randomized);
        setAnswers(Array(randomized.length).fill(null));
        setCurrentQuestion(0);
        setTimeLeft(EXAM_DURATION_SECONDS);
        setViolations([]);
        setShowResult(false);
        setShowReview(false);
        setIsDisqualified(false);
        setIsStarted(true);

        // เข้าสู่โหมดเต็มจอทันที
        await enterFullscreen();
      };

      const handleAnswerSelect = (optionIdx) => {
        const newAnswers = [...answers];
        newAnswers[currentQuestion] = optionIdx;
        setAnswers(newAnswers);
      };

      // บันทึกและส่งข้อสอบ
      const forceFinishExam = (disqualified = false, currentViolations = []) => {
        let finalScore = 0;
        answers.forEach((ans, idx) => {
          if (ans === shuffledQuestions[idx]?.answer) {
            finalScore++;
          }
        });

        // หากถูกตัดสิทธิ์จากการทุจริต ปรับคะแนนเป็น 0 พร้อมทำหมายเหตุ
        const finalCalculatedScore = disqualified ? 0 : finalScore;
        setScore(finalCalculatedScore);

        const trimmedId = studentId.trim();
        const record = {
          examType: "Midterm Examination (ข้อสอบกลางภาค)",
          studentName: userName,
          studentId: trimmedId,
          seatNumber: seatNumber || "-",
          score: finalCalculatedScore,
          rawScore: finalScore,
          total: shuffledQuestions.length,
          percentage: ((finalCalculatedScore / shuffledQuestions.length) * 100).toFixed(2),
          disqualified: disqualified,
          violationsList: currentViolations,
          timestamp: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
          date: new Date().toLocaleDateString('th-TH')
        };

        const updatedHistory = {
          ...attemptsRecord,
          [trimmedId]: [...(attemptsRecord[trimmedId] || []), record]
        };

        setAttemptsRecord(updatedHistory);
        try {
          localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(updatedHistory));
          sessionStorage.removeItem(SESSION_KEY); // ล้าง session เมื่อสอบเสร็จสิ้น
        } catch (e) {
          console.error("Storage error:", e);
        }

        setShowResult(true);
        setShowLockWarningModal(false);
        setConfirmSubmitModal(false);

        // ออกจาก Fullscreen เมื่อเสร็จสิ้น
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      };

      const handlePrint = () => {
        const printElem = document.getElementById('printable-midterm-card');
        if (!printElem) {
          window.print();
          return;
        }

        const printWin = window.open('', '_blank');
        if (!printWin) {
          window.print();
          return;

        printWin.document.write(`
          <!DOCTYPE html>
          <html lang="th">
          <head>
            <meta charset="UTF-8">
            <title>รายงานผลการสอบกลางภาค - ${userName} (${studentId})</title>
            <script src="https://cdn.tailwindcss.com"><\/script>
            <style>
              @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap');
              body {
                font-family: 'Sarabun', sans-serif;
                background-color: white !important;
                color: black !important;
                padding: 30px !important;
                margin: 0 !important;
              }
              * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
              }
            </style>
          </head>
          <body class="bg-white">
            <div class="max-w-4xl mx-auto border-2 border-slate-300 p-8 rounded-2xl">
              ${printElem.innerHTML}
            </div>
            <script>
              window.onload = function() {
                setTimeout(() => {
                  window.focus();
                  window.print();
                  window.onafterprint = function() { window.close(); };
                }, 500);
              };
            <\/script>
          </body>
          </html>
        `);
        printWin.document.close();
      };

      // ฟังก์ชันล็อกอินโหมดอาจารย์
      const handleTeacherAuth = (e) => {
        e.preventDefault();
        if (teacherPinInput.trim() === TEACHER_PIN_DEFAULT) {
          setIsTeacherMode(true);
          setShowTeacherAuthModal(false);
          setTeacherPinInput('');
          setTeacherPinError('');
        } else {
          setTeacherPinError('รหัส PIN ไม่ถูกต้อง');
        }
      };

      // แปลงข้อมูลการสอบทั้งหมดออกมาเป็น List เดียว
      const allSubmittedRecords = useMemo(() => {
        const list = [];
        Object.keys(attemptsRecord).forEach((sid) => {
          const studentAttempts = attemptsRecord[sid] || [];
          studentAttempts.forEach((rec) => {
            list.push(rec);
          });
        });
        return list;
      }, [attemptsRecord]);

      // กรองและค้นหารายชื่อนักศึกษาในตารางอาจารย์
      const filteredRecords = useMemo(() => {
        return allSubmittedRecords.filter((rec) => {
          const matchesQuery = 
            rec.studentName?.toLowerCase().includes(searchQuery.toLowerCase()) ||
            rec.studentId?.toLowerCase().includes(searchQuery.toLowerCase()) ||
            rec.seatNumber?.toLowerCase().includes(searchQuery.toLowerCase());

          if (!matchesQuery) return false;

          const isPassed = !rec.disqualified && Number(rec.percentage) >= 60;
          if (filterStatus === 'PASSED') return isPassed;
          if (filterStatus === 'FAILED') return !isPassed && !rec.disqualified;
          if (filterStatus === 'DISQUALIFIED') return rec.disqualified;
          return true;
        });
      }, [allSubmittedRecords, searchQuery, filterStatus]);

      // ฟังก์ชันปลดล็อกให้นักศึกษาทำใหม่ (กรณีเกิดข้อผิดพลาดทางเทคนิค)
      const handleUnlockStudent = (sId, sName) => {
        const confirmMsg = `ยืนยันการปลดล็อกสิทธิ์สอบให้แก่:\n${sName} (รหัส ${sId})\n\nเมื่อปลดล็อกแล้ว ประวัติการสอบเดิมจะถูกรีเซ็ต และนักศึกษาจะสามารถล็อกอินเข้าสอบใหม่ได้ทันที`;
        // สร้าง confirm ด้วย modal หรือตรวจสอบความปลอดภัย
        if (window.confirm ? window.confirm(confirmMsg) : true) {
          const updated = { ...attemptsRecord };
          delete updated[sId];
          setAttemptsRecord(updated);
          try {
            localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(updated));
            sessionStorage.removeItem(SESSION_KEY);
          } catch (e) {
            console.error("Storage update error", e);
          }
        }
      };

      // ฟังก์ชันส่งออกคะแนนเป็นไฟล์ CSV (Excel)
      const handleExportCSV = () => {
        if (allSubmittedRecords.length === 0) {
          return;
        }

        const headers = ["รหัสนักศึกษา", "ชื่อ-สกุล", "เลขที่นั่ง/เครื่อง", "คะแนน", "คะแนนเต็ม", "ร้อยละ", "ผลประเมิน", "จำนวนครั้งที่หลุดจอ", "วันที่สอบ", "เวลาที่ส่ง"];
        const rows = allSubmittedRecords.map((r) => [
          `"${r.studentId}"`,
          `"${r.studentName}"`,
          `"${r.seatNumber || '-'}"`,
          r.score,
          r.total,
          `${r.percentage}%`,
          r.disqualified ? '"ถูกตัดสิทธิ์ (ทุจริต)"' : (Number(r.percentage) >= 60 ? '"ผ่านเกณฑ์"' : '"ไม่ผ่านเกณฑ์"'),
          r.violationsList ? r.violationsList.length : 0,
          `"${r.date}"`,
          `"${r.timestamp}"`
        ]);

        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `BCN_Midterm_Exam_Results_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // ==========================================
      // มุมมอง: แผงควบคุมอาจารย์ผู้คุมสอบ (TEACHER DASHBOARD)
      // ==========================================
      if (isTeacherMode) {
        const totalCount = allSubmittedRecords.length;
        const passedCount = allSubmittedRecords.filter(r => !r.disqualified && Number(r.percentage) >= 60).length;
        const disqualifiedCount = allSubmittedRecords.filter(r => r.disqualified).length;
        const avgScore = totalCount > 0 
          ? (allSubmittedRecords.reduce((acc, cur) => acc + (cur.score || 0), 0) / totalCount).toFixed(1) 
          : '0.0';

        return (
          <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
            <div className="max-w-7xl mx-auto space-y-6">
              
              {/* Teacher Top Navigation */}
              <div className="bg-slate-800/90 border border-slate-700 p-6 rounded-3xl backdrop-blur-md flex flex-wrap justify-between items-center gap-4 shadow-xl">
                <div className="flex items-center gap-3">
                  <div className="w-12 h-12 rounded-2xl bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-indigo-400">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">
                        Proctor Mode Active
                      </span>
                      <span className="text-xs text-slate-400">วิทยาลัยพยาบาลบรมราชชนนี สุพรรณบุรี</span>
                    </div>
                    <h1 className="text-xl md:text-2xl font-black text-white mt-1">
                      ระบบติดตามและตรวจผลการสอบกลางภาค (Proctor Dashboard)
                    </h1>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  <button
                    onClick={handleExportCSV}
                    disabled={totalCount === 0}
                    className="bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 text-white font-bold px-4 py-2.5 rounded-xl text-xs flex items-center gap-2 transition shadow-lg shadow-emerald-600/20"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    <span>ดาวน์โหลดคะแนน Excel (CSV)</span>
                  </button>

                  <button
                    onClick={() => setIsTeacherMode(false)}
                    className="bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold px-4 py-2.5 rounded-xl text-xs flex items-center gap-1.5 transition border border-slate-600"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    <span>ออกจากโหมดอาจารย์</span>
                  </button>
                </div>
              </div>

              {/* Statistics Metric Cards */}
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div className="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl">
                  <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">ผู้ส่งข้อสอบทั้งหมด</p>
                  <p className="text-3xl font-black text-white mt-1 font-mono-tech">{totalCount} <span className="text-xs text-slate-500 font-normal">คน</span></p>
                  <p className="text-[11px] text-slate-400 mt-2">จากข้อสอบ 60 ข้อมาตรฐาน</p>
                </div>

                <div className="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl">
                  <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">คะแนนเฉลี่ย (Average)</p>
                  <p className="text-3xl font-black text-indigo-400 mt-1 font-mono-tech">{avgScore} <span className="text-xs text-slate-500 font-normal">/ 60</span></p>
                  <p className="text-[11px] text-slate-400 mt-2">คิดเป็น {totalCount > 0 ? ((avgScore / 60) * 100).toFixed(1) : 0}%</p>
                </div>

                <div className="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl">
                  <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">สอบผ่านเกณฑ์ (≥ 60%)</p>
                  <p className="text-3xl font-black text-emerald-400 mt-1 font-mono-tech">{passedCount} <span className="text-xs text-slate-500 font-normal">คน</span></p>
                  <p className="text-[11px] text-emerald-500/80 mt-2">
                    {totalCount > 0 ? ((passedCount / totalCount) * 100).toFixed(1) : 0}% ของผู้สอบทั้งหมด
                  </p>
                </div>

                <div className="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl">
                  <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">ถูกตัดสิทธิ์ / ทุจริต</p>
                  <p className="text-3xl font-black text-rose-400 mt-1 font-mono-tech">{disqualifiedCount} <span className="text-xs text-slate-500 font-normal">คน</span></p>
                  <p className="text-[11px] text-rose-400/80 mt-2">
                    หลุดจอหรือสลับแท็บเกิน 3 ครั้ง
                  </p>
                </div>
              </div>

              {/* Search, Filter & Student List Table */}
              <div className="bg-slate-800/80 border border-slate-700 rounded-3xl p-6 shadow-xl space-y-4">
                
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 pb-4 border-b border-slate-700">
                  <div className="relative w-full md:w-80">
                    <svg className="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <input
                      type="text"
                      placeholder="ค้นหาชื่อ, รหัสนักศึกษา, ที่นั่ง..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
                    />
                  </div>

                  <div className="flex flex-wrap items-center gap-2">
                    <span className="text-xs text-slate-400">ตัวกรอง:</span>
                    {[
                      { key: 'ALL', label: 'ทั้งหมด' },
                      { key: 'PASSED', label: 'ผ่านเกณฑ์' },
                      { key: 'FAILED', label: 'ไม่ผ่าน' },
                      { key: 'DISQUALIFIED', label: 'ถูกตัดสิทธิ์' }
                    ].map((tab) => (
                      <button
                        key={tab.key}
                        onClick={() => setFilterStatus(tab.key)}
                        className={`text-xs px-3 py-1.5 rounded-xl font-bold transition ${
                          filterStatus === tab.key
                            ? 'bg-indigo-600 text-white shadow-md'
                            : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-700'
                        }`}
                      >
                        {tab.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Table Content */}
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="border-b border-slate-700 text-slate-400 font-bold uppercase text-[11px] tracking-wider">
                        <th className="py-3 px-3">รหัสนักศึกษา</th>
                        <th className="py-3 px-3">ชื่อ-นามสกุล</th>
                        <th className="py-3 px-3 text-center">เครื่อง/ที่นั่ง</th>
                        <th className="py-3 px-3 text-center">คะแนนดิบ</th>
                        <th className="py-3 px-3 text-center">ร้อยละ</th>
                        <th className="py-3 px-3 text-center">ผลการสอบ</th>
                        <th className="py-3 px-3 text-center">สถิติหลุดจอ</th>
                        <th className="py-3 px-3 text-center">เวลาที่ส่ง</th>
                        <th className="py-3 px-3 text-right">การจัดการ</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-700/60">
                      {filteredRecords.length > 0 ? (
                        filteredRecords.map((r, idx) => {
                          const isPassed = !r.disqualified && Number(r.percentage) >= 60;
                          const violationCount = r.violationsList ? r.violationsList.length : 0;

                          return (
                            <tr key={idx} className="hover:bg-slate-700/30 transition">
                              <td className="py-3.5 px-3 font-mono text-slate-300 font-semibold">{r.studentId}</td>
                              <td className="py-3.5 px-3 font-bold text-white">{r.studentName}</td>
                              <td className="py-3.5 px-3 text-center text-slate-400 font-mono">{r.seatNumber || "-"}</td>
                              <td className="py-3.5 px-3 text-center font-bold font-mono-tech text-sm text-indigo-300">
                                {r.score} <span className="text-[10px] text-slate-500 font-normal">/ {r.total}</span>
                              </td>
                              <td className="py-3.5 px-3 text-center font-bold font-mono-tech text-sm text-white">
                                {r.percentage}%
                              </td>
                              <td className="py-3.5 px-3 text-center">
                                {r.disqualified ? (
                                  <span className="bg-rose-950 text-rose-300 border border-rose-800 text-[10px] px-2.5 py-1 rounded-full font-bold">
                                    ถูกตัดสิทธิ์สอบ
                                  </span>
                                ) : isPassed ? (
                                  <span className="bg-emerald-950 text-emerald-300 border border-emerald-800 text-[10px] px-2.5 py-1 rounded-full font-bold">
                                    ✓ ผ่านเกณฑ์
                                  </span>
                                ) : (
                                  <span className="bg-amber-950 text-amber-300 border border-amber-800 text-[10px] px-2.5 py-1 rounded-full font-bold">
                                    ✗ ไม่ผ่าน
                                  </span>
                                )}
                              </td>
                              <td className="py-3.5 px-3 text-center">
                                <button
                                  onClick={() => setSelectedAuditRecord(r)}
                                  className={`text-[11px] font-mono-tech font-bold px-2 py-0.5 rounded-lg border transition ${
                                    violationCount === 0
                                      ? 'bg-slate-900 text-slate-400 border-slate-700 hover:border-slate-500'
                                      : violationCount >= 3
                                        ? 'bg-rose-950 text-rose-400 border-rose-800 animate-pulse'
                                        : 'bg-amber-950 text-amber-400 border-amber-800'
                                  }`}
                                  title="คลิกเพื่อดู Audit Log รายละเอียด"
                                >
                                  {violationCount} ครั้ง 🔍
                                </button>
                              </td>
                              <td className="py-3.5 px-3 text-center text-slate-400 font-mono text-[11px]">
                                {r.timestamp}
                              </td>
                              <td className="py-3.5 px-3 text-right">
                                <div className="flex items-center justify-end gap-1.5">
                                  <button
                                    onClick={() => setSelectedAuditRecord(r)}
                                    className="bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1 rounded-lg text-[11px] font-bold transition"
                                    title="ตรวจสอบบันทึกความปลอดภัย"
                                  >
                                    Logs
                                  </button>
                                  <button
                                    onClick={() => handleUnlockStudent(r.studentId, r.studentName)}
                                    className="bg-amber-600/20 hover:bg-amber-600/40 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-lg text-[11px] font-bold transition"
                                    title="ปลดล็อกให้สอบใหม่หากมีเหตุสุดวิสัย"
                                  >
                                    ปลดล็อก
                                  </button>
                                </div>
                              </td>
                            </tr>
                          );
                        })
                      ) : (
                        <tr>
                          <td colSpan="9" className="py-12 text-center text-slate-500">
                            {allSubmittedRecords.length === 0 ? (
                              <div className="space-y-1">
                                <p className="text-base">ยังไม่มีนักศึกษาคนใดส่งข้อสอบในเบราว์เซอร์นี้</p>
                                <p className="text-xs text-slate-600">เมื่อนักศึกษาทำข้อสอบและส่งผล ระบบจะบันทึกข้อมูลและแสดงผลในตารางนี้อัตโนมัติ</p>
                              </div>
                            ) : (
                              'ไม่พบข้อมูลที่ตรงกับคำค้นหาหรือตัวกรอง'
                            )}
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>

              </div>

            </div>

            {/* Modal: ตรวจสอบ Security Audit Logs ของนักศึกษา */}
            {selectedAuditRecord && (
              <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                <div className="max-w-lg w-full bg-slate-900 border border-slate-700 rounded-3xl p-6 text-slate-100 shadow-2xl space-y-4">
                  <div className="flex justify-between items-start border-b border-slate-800 pb-3">
                    <div>
                      <span className="text-[10px] font-bold uppercase tracking-wider bg-indigo-500/20 text-indigo-400 px-2.5 py-0.5 rounded-full border border-indigo-500/30">
                        Incident Audit Log
                      </span>
                      <h3 className="text-lg font-bold text-white mt-1">
                        {selectedAuditRecord.studentName}
                      </h3>
                      <p className="text-xs text-slate-400">
                        รหัส: {selectedAuditRecord.studentId} • เครื่อง: {selectedAuditRecord.seatNumber || "-"}
                      </p>
                    </div>
                    <button
                      onClick={() => setSelectedAuditRecord(null)}
                      className="text-slate-400 hover:text-white p-1 rounded-lg"
                    >
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                  </div>

                  <div className="space-y-2">
                    <p className="text-xs font-bold text-slate-300">
                      รายการแจ้งเตือนสลับหน้าจอ / หลุดโหมดล็อก ({selectedAuditRecord.violationsList?.length || 0} ครั้ง):
                    </p>
                    <div className="bg-slate-950 border border-slate-800 rounded-2xl p-3 max-h-60 overflow-y-auto space-y-2 text-xs">

                            </span>
                            <span className="font-mono text-slate-500 text-[11px] flex-shrink-0">
                              {v.timestamp} น.
                            </span>
                          </div>

                      ) : (
                        <p className="text-emerald-400 py-4 text-center italic">
                          ✓ ไม่พบประวัติการหลุดหน้าจอหรือสลับแท็บตลอดการสอบ

                    </div>
                  </div>

                  <div className="pt-2 border-t border-slate-800 flex justify-end">
                    <button
                      onClick={() => setSelectedAuditRecord(null)}
                      className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition"
                    >
                      ปิดหน้าต่าง
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>

      if (!isStarted) {
        const currentCheckId = studentId.trim();
        const pastHistory = currentCheckId ? (attemptsRecord[currentCheckId] || []) : [];

        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 flex flex-col justify-between p-4">
            
            {/* Top Navigation for Instructor Entry */}
            <div className="max-w-4xl w-full mx-auto flex justify-between items-center py-2">

                      </p>
                      <p>ท่านได้ส่งข้อสอบไปแล้วเมื่อ {pastHistory[0]?.timestamp} ({pastHistory[0]?.date}) คะแนน: <strong>{pastHistory[0]?.score}/{pastHistory[0]?.total}</strong></p>
                      <p className="text-rose-600 font-bold">⚠️ ข้อสอบกลางภาคไม่อนุญาตให้ทำซ้ำ หากมีข้อขัดข้องกรุณาแจ้งอาจารย์คุมสอบเพื่อขอปลดล็อก</p>

                  {/* Security Instructions Warning */}
                  <div className="bg-slate-900 text-slate-200 p-4 rounded-2xl text-xs space-y-2 border border-slate-700 shadow-inner">

                      <svg className="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>

                    </div>

                      <li>เมื่อกดเริ่มสอบ ระบบจะ <strong>บังคับเข้าสู่โหมดเต็มจอ (Fullscreen Lock)</strong> ทันที</li>
                      <li><strong>ห้ามสลับหน้าจอ ห้ามกด Alt+Tab และห้ามเปิดแท็บอื่น</strong> ระบบจะบันทึกเวลาที่สลับทันที</li>
                      <li>หากตรวจพบการหลุดหน้าจอหรือสลับแท็บเกิน <strong>{MAX_VIOLATIONS} ครั้ง</strong> ระบบจะ <strong>ตัดสิทธิ์สอบและส่งกระดาษคำตอบทันที</strong></li>

                    </ul>
                  </div>

                  <button 
                    type="submit"
                    disabled={pastHistory.length >= MAX_ATTEMPTS}
                    className="w-full bg-gradient-to-r from-blue-700 via-indigo-700 to-indigo-800 text-white font-extrabold py-4 px-6 rounded-2xl hover:from-blue-800 hover:to-indigo-900 transition duration-200 shadow-xl shadow-indigo-600/30 transform active:scale-[0.99] flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    <svg className="w-5 h-5 text-indigo-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"/></svg>
                    <span>ยืนยันตัวตนและเข้าสู่การสอบ</span>
                  </button>
                </form>
              </div>
            </div>

            {/* Modal: รหัสผ่านยืนยันสิทธิ์อาจารย์ผู้คุมสอบ */}
            {showTeacherAuthModal && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                <div className="max-w-sm w-full bg-slate-900 border border-slate-700 rounded-3xl p-6 text-white text-center shadow-2xl">
                  <div className="w-12 h-12 bg-indigo-500/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-3">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                  </div>
                  <h4 className="text-lg font-bold">เข้าสู่แผงควบคุมอาจารย์ผู้คุมสอบ</h4>

                      type="password"
                      autoFocus
                      maxLength={6}

                    />

                      <p className="text-rose-400 text-xs">{teacherPinError}</p>
                    )}

                    <div className="grid grid-cols-2 gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => {
                          setShowTeacherAuthModal(false);
                          setTeacherPinInput('');
                          setTeacherPinError('');
                        }}
                        className="py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition"
                      >

                      </button>
                      <button
                        type="submit"
                        className="py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs transition shadow-md"
                      >
                        เข้าสู่ระบบ
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            <div className="text-center text-[11px] text-slate-500 py-1">
              วิทยาลัยพยาบาลบรมราชชนนี สุพรรณบุรี • BCN Suphanburi Examination System
            </div>
          </div>
        );
      }

      if (showResult) {
        const percentage = ((score / shuffledQuestions.length) * 100).toFixed(2);
        const isPassed = !isDisqualified && Number(percentage) >= 60;

        return (
          <div className="min-h-screen bg-slate-900 p-4 md:p-10 print:bg-white print:p-0">
            <div className="max-w-4xl mx-auto space-y-6">
              
              <div className="bg-white border border-slate-200 p-6 md:p-10 rounded-3xl shadow-2xl print:border-0 print:shadow-none print:p-4">
                <div id="printable-midterm-card" className="space-y-6">
                  
                  {/* Top Certificate Header */}
                  <div className="text-center border-b pb-6 border-slate-200">
                    <div className="inline-block bg-indigo-50 text-indigo-900 border border-indigo-200 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest mb-2">

                      </div>
                      <p className="text-xs text-rose-600 font-medium">
                        มีการออกจากหน้าจอหรือสลับแท็บเกินเกณฑ์ที่กำหนด ({MAX_VIOLATIONS} ครั้ง) ระบบปรับผลคะแนนเป็น 0 คะแนนตามระเบียบการสอบกลางภาค
                      </p>
                    </div>

                  )}

                      <p className="font-semibold text-slate-500 uppercase">ชื่อผู้เข้าสอบ</p>
                      <p className="text-base font-bold text-slate-900 mt-0.5">{userName}</p>
                    </div>
                    <div>
                      <p className="font-semibold text-slate-500 uppercase">รหัสประจำตัว</p>
                      <p className="text-base font-bold text-slate-900 mt-0.5">{studentId}</p>
                    </div>
                    <div>
                      <p className="font-semibold text-slate-500 uppercase">เลขที่นั่ง/เครื่อง</p>
                      <p className="text-base font-bold text-slate-900 mt-0.5">{seatNumber || "-"}</p>
                    </div>
                    <div>
                      <p className="font-semibold text-slate-500 uppercase">วันที่สอบ</p>
                      <p className="text-base font-bold text-slate-900 mt-0.5">{new Date().toLocaleDateString('th-TH')}</p>
                    </div>

                    <div className="col-span-2 pt-3 border-t border-slate-200">
                      <p className="font-semibold text-slate-500 uppercase">คะแนนที่ได้ (Score)</p>
                      <p className="text-2xl font-black text-indigo-700 mt-0.5">
                        {score} <span className="text-sm font-medium text-slate-500">/ {shuffledQuestions.length} คะแนน</span>

                    </div>
                    <div className="col-span-2 pt-3 border-t border-slate-200">
                      <p className="font-semibold text-slate-500 uppercase">คิดเป็นร้อยละ (Percentage)</p>
                      <p className="text-2xl font-black text-indigo-700 mt-0.5">
                        {percentage}%
                      </p>
                    </div>
                  </div>

                  {/* Anti-cheat Audit Log (พิมพ์ลงใบผลสอบด้วยเพื่อความโปร่งใส) */}
                  <div className="bg-slate-50 border border-slate-200 p-4 rounded-2xl text-xs space-y-2">
                    <div className="flex items-center justify-between font-bold text-slate-700">
                      <span className="flex items-center gap-1.5">
                        <svg className="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                        บันทึกการตรวจสอบความปลอดภัยระหว่างสอบ (Security Audit Logs):
                      </span>
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${violations.length === 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                        {violations.length === 0 ? 'ปลอดภัย 100% ไม่พบการละเมิด' : `พบเหตุการณ์หลุดจอ/สลับหน้าต่าง ${violations.length} ครั้ง`}
                      </span>
                    </div>
                    {violations.length > 0 ? (
                      <div className="divide-y divide-slate-200 max-h-32 overflow-y-auto">
                        {violations.map((item, vIdx) => (
                          <div key={vIdx} className="py-1 flex justify-between text-slate-600">
                            <span>{vIdx + 1}. {item.reason}</span>
                            <span className="font-mono text-slate-400">{item.timestamp} น.</span>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <p className="text-slate-500 italic">นักศึกษาทำข้อสอบภายใต้สภาพแวดล้อมล็อกหน้าจอสมบูรณ์ตลอดระยะเวลาการสอบ</p>
                    )}
                  </div>

                  {/* Signatures */}
                  <div className="pt-10 border-t border-slate-200">
                    <div className="grid grid-cols-2 gap-8 text-center text-xs">
                      <div>
                        <p className="mb-12 text-slate-400">ลงชื่อ...................................................................</p>
                        <p className="font-bold text-slate-800 text-sm">{userName}</p>
                        <p className="text-slate-500 mt-0.5">นักศึกษาผู้เข้ารับการทดสอบ</p>
                      </div>
                      <div>
                        <p className="mb-12 text-slate-400">ลงชื่อ...................................................................</p>
                        <p className="font-bold text-slate-800 text-sm">( ................................................................... )</p>
                        <p className="text-slate-500 mt-0.5">อาจารย์ผู้ควบคุมการสอบกลางภาค</p>
                      </div>
                    </div>
                  </div>

                </div>

                {/* Print and Action Controls */}
                <div className="flex flex-wrap justify-center gap-3 pt-6 border-t border-slate-100 no-print">
                  <button 
                    onClick={handlePrint}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-bold shadow-md hover:shadow-lg transition transform active:scale-95 flex items-center gap-2"
                  >
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-3a2 2 0 00-2-2H9a2 2 0 00-2 2v3a2 2 0 002 2zm0 0v-9a2 2 0 012-2h2a2 2 0 012 2v9m-4 0h4"/></svg>
                    พิมพ์เอกสารรับรองคะแนน / PDF
                  </button>

                  {/* ล็อกเฉลยคำตอบ (Disable Answer Key) */}
                  <div 
                    className="bg-slate-100 text-slate-400 border border-slate-200 px-5 py-3 rounded-xl font-bold text-xs flex items-center gap-2 cursor-not-allowed select-none"
                    title="ระบบปิดการแสดงเฉลยเพื่อความปลอดภัยของการสอบกลางภาค"
                  >
                    <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    <span>ระบบเฉลยคำตอบถูกล็อก (Answer Key Locked)</span>
                  </div>

                  <button 
                    onClick={() => {
                      sessionStorage.removeItem(SESSION_KEY);
                      setIsStarted(false);
                      setShowResult(false);
                      setShowReview(false);
                    }}
                    className="bg-slate-200 hover:bg-slate-300 text-slate-800 px-6 py-3 rounded-xl font-bold transition flex items-center gap-2"
                  >
                    ออกจากระบบสอบ
                  </button>
                </div>

                {/* ข้อความแจ้งเตือนการปิดเฉลยข้อสอบ */}
                <div className="mt-4 p-3.5 bg-amber-50 border border-amber-200 rounded-2xl text-xs text-amber-900 flex items-center justify-center gap-2 text-center no-print">
                  <svg className="w-5 h-5 text-amber-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  <span><strong>ประกาศความปลอดภัย:</strong> ระบบปิดการแสดงเฉลยคำตอบและเหตุผลทางวิชาการ (Disabled Answer Key) ชั่วคราว โดยอาจารย์ผู้สอนจะประกาศเฉลยอย่างเป็นทางการหลังจากเสร็จสิ้นการจัดสอบทุกกลุ่ม</span>
                </div>
              </div>

            </div>
          </div>
        );
      }

      const q = shuffledQuestions[currentQuestion];
      if (!q) return null;

      const answeredCount = answers.filter(a => a !== null).length;

      return (
        <div className="min-h-screen bg-slate-950 flex flex-col justify-between select-none">
          
          {/* Top Security & Status Bar */}
          <header className="bg-slate-900 border-b border-slate-800 px-4 md:px-8 py-3 text-white sticky top-0 z-40 shadow-lg">
            <div className="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-3">
              
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-1.5 bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                  <span className="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
                  Exam Lock Active
                </div>
                <div>
                  <span className="text-xs text-slate-300 font-semibold">ผู้สอบ: </span>
                  <span className="text-xs font-bold text-white">{userName}</span>
                  <span className="text-xs text-slate-400 ml-1">({studentId})</span>
                </div>
              </div>

              {/* Violations Strike Meter */}
              <div className="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700 text-xs">
                <span className="text-slate-400">การแจ้งเตือนสลับจอ:</span>
                <span className={`font-mono-tech font-bold px-2 py-0.5 rounded-lg ${violations.length === 0 ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400 border border-rose-800 animate-pulse'}`}>
                  {violations.length} / {MAX_VIOLATIONS}
                </span>
              </div>

              {/* Countdown Clock */}
              <div className="flex items-center gap-2 bg-indigo-950/70 border border-indigo-700/50 px-4 py-1.5 rounded-xl">
                <svg className="w-5 h-5 text-indigo-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <div className="text-right">
                  <span className="text-[10px] uppercase font-bold text-indigo-300 tracking-wider block leading-none">เวลาคงเหลือ</span>
                  <span className={`font-mono-tech text-lg font-black leading-tight ${timeLeft < 300 ? 'text-rose-400 animate-bounce' : 'text-white'}`}>
                    {formatTime(timeLeft)}
                  </span>
                </div>
              </div>

            </div>
          </header>

          {/* Exam Container */}
          <main className="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center">
            
            {/* Progress Bar & Quick Stats */}
            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl mb-4 text-xs text-slate-300 flex flex-wrap justify-between items-center gap-2">
              <div className="flex items-center gap-2">
                <span className="font-bold text-white text-sm">ข้อที่ {currentQuestion + 1} / {shuffledQuestions.length}</span>
                <span className="text-slate-500">•</span>
                <span className="text-indigo-400 font-medium">ตอบแล้ว {answeredCount} ข้อ (เหลือ {shuffledQuestions.length - answeredCount} ข้อ)</span>
              </div>

              {q.category && (
                <span className="bg-slate-800 text-slate-300 px-3 py-1 rounded-lg font-medium border border-slate-700">
                  หมวด: {q.category}
                </span>
              )}
            </div>

            {/* Question Card */}
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl relative overflow-hidden">
              
              {/* Question Text */}
              <h2 className="text-base md:text-xl font-bold text-white leading-relaxed mb-6">
                {q.question}
              </h2>

              {/* Options */}
              <div className="space-y-3">
                {q.options.map((optText, optIdx) => {
                  const isSelected = answers[currentQuestion] === optIdx;
                  return (
                    <button
                      key={optIdx}
                      onClick={() => handleAnswerSelect(optIdx)}
                      className={`w-full text-left p-4 rounded-2xl border-2 transition duration-150 flex items-center gap-4 ${
                        isSelected 
                          ? 'border-indigo-500 bg-indigo-950/70 text-white shadow-lg ring-2 ring-indigo-500/40' 
                          : 'border-slate-800 bg-slate-850 hover:bg-slate-800 text-slate-300'
                      }`}
                    >
                      <div className={`w-9 h-9 rounded-xl flex items-center justify-center font-black text-sm flex-shrink-0 border ${
                        isSelected 
                          ? 'bg-indigo-600 border-indigo-400 text-white' 
                          : 'bg-slate-800 border-slate-700 text-slate-400'
                      }`}>
                        {String.fromCharCode(65 + optIdx)}
                      </div>
                      <span className="text-sm md:text-base font-medium leading-normal">{optText}</span>
                    </button>
                  );
                })}
              </div>

              {/* Navigation Controls */}
              <div className="mt-8 pt-6 border-t border-slate-800 flex justify-between items-center gap-3">
                <button
                  disabled={currentQuestion === 0}
                  onClick={() => setCurrentQuestion(currentQuestion - 1)}
                  className="px-5 py-2.5 rounded-xl border border-slate-700 text-slate-400 hover:text-white hover:bg-slate-800 transition disabled:opacity-30 disabled:cursor-not-allowed font-bold text-sm flex items-center gap-1.5"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"/></svg>
                  ย้อนกลับ
                </button>

                <div className="flex gap-2">
                  <button
                    onClick={() => setConfirmSubmitModal(true)}
                    className="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-xs border border-amber-500/30 transition flex items-center gap-1"
                  >
                    ส่งข้อสอบ
                  </button>

                  <button
                    onClick={() => {
                      if (currentQuestion < shuffledQuestions.length - 1) {
                        setCurrentQuestion(currentQuestion + 1);
                      } else {
                        setConfirmSubmitModal(true);
                      }
                    }}
                    className="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition flex items-center gap-1.5"
                  >
                    <span>{currentQuestion === shuffledQuestions.length - 1 ? 'ตรวจทาน / ส่งข้อสอบ' : 'ข้อถัดไป'}</span>
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/></svg>
                  </button>
                </div>
              </div>

            </div>

            {/* Quick Question Navigation Matrix */}
            <div className="mt-4 bg-slate-900 border border-slate-800 p-4 rounded-2xl">
              <p className="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">กระดานข้อสอบ (กดข้ามไปยังข้อที่ต้องการ):</p>
              <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto pr-1">
                {shuffledQuestions.map((_, idx) => {
                  const isAnswered = answers[idx] !== null;
                  const isCurrent = currentQuestion === idx;
                  return (
                    <button
                      key={idx}
                      onClick={() => setCurrentQuestion(idx)}
                      className={`w-7 h-7 rounded-lg text-xs font-bold transition flex items-center justify-center ${
                        isCurrent 
                          ? 'ring-2 ring-indigo-400 bg-indigo-600 text-white' 
                          : isAnswered 
                            ? 'bg-emerald-950 text-emerald-300 border border-emerald-700' 
                            : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                      }`}
                    >
                      {idx + 1}
                    </button>
                  );
                })}
              </div>
            </div>

          </main>

          {}
          {showLockWarningModal && (
            <div className="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4 select-none">
              <div className="max-w-md w-full bg-slate-900 border-2 border-rose-500 rounded-3xl p-6 md:p-8 text-center shadow-2xl text-white">
                
                <div className="w-16 h-16 bg-rose-500/20 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-rose-500/40 animate-bounce">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                </div>

                <h3 className="text-xl font-black text-rose-400">ตรวจพบการสลับหน้าจอ / หลุดโหมดล็อก</h3>
                <p className="text-slate-300 text-xs mt-3 leading-relaxed">
                  {lockWarningReason || 'ระบบตรวจพบว่าท่านออกจากหน้าจอสอบหรือเปลี่ยนแท็บ'}
                </p>

                <div className="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 my-4 text-xs">
                  <p className="text-slate-400">จำนวนครั้งที่ตรวจพบ:</p>
                  <p className="text-2xl font-mono-tech font-bold text-rose-400 mt-1">
                    {violations.length} / {MAX_VIOLATIONS} ครั้ง
                  </p>
                  <p className="text-[11px] text-slate-400 mt-1">
                    {violations.length >= MAX_VIOLATIONS - 1 
                      ? '⚠️ เตือนครั้งสุดท้าย! หากหลุดอีก 1 ครั้ง ระบบจะตัดสิทธิ์สอบทันที' 
                      : 'หากละเมิดครบ 3 ครั้ง ระบบจะส่งข้อสอบและปรับตกอัตโนมัติ'}
                  </p>
                </div>

                <button
                  onClick={enterFullscreen}
                  className="w-full bg-rose-600 hover:bg-rose-700 text-white font-extrabold py-3.5 px-4 rounded-xl shadow-lg shadow-rose-600/30 transition transform active:scale-95"
                >
                  ล็อกหน้าจอกลับสู่โหมดเต็มจอเพื่อทำข้อสอบต่อ
                </button>

              </div>
            </div>
          )}

          {}
          {confirmSubmitModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="max-w-sm w-full bg-slate-900 border border-slate-700 rounded-3xl p-6 text-white text-center shadow-2xl">
                <div className="w-12 h-12 bg-indigo-500/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-3">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
                <h4 className="text-lg font-bold">ยืนยันการส่งข้อสอบกลางภาค</h4>
                <p className="text-xs text-slate-300 mt-2">
                  คุณได้ทำข้อสอบไปแล้ว <strong>{answeredCount} / {shuffledQuestions.length} ข้อ</strong>
                  {answeredCount < shuffledQuestions.length && (
                    <span className="block text-amber-400 font-semibold mt-1">
                      ⚠️ ยังมีข้อที่ยังไม่ได้ตอบอีก {shuffledQuestions.length - answeredCount} ข้อ!
                    </span>
                  )}
                </p>

                <div className="grid grid-cols-2 gap-3 mt-6">
                  <button
                    onClick={() => setConfirmSubmitModal(false)}
                    className="py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition"
                  >
                    กลับไปทำต่อ
                  </button>
                  <button
                    onClick={() => forceFinishExam(false, violations)}
                    className="py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs transition shadow-md"
                  >
                    ยืนยันส่งข้อสอบ
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<MidtermExamApp />);
  </script>
</body>
</html>
